<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Adobe Embed Test</title>
    <!-- Load the SDK -->
    <script src="https://documentcloud.adobe.com/view-sdk/main.js"></script>
    <style>
      html,body { margin:0; padding:0; height:100%; }
      #adobe-dc-view { height:100vh; width:100vw; }
    </style>
  </head>
  <body>
    <div id="adobe-dc-view"></div>

    <script>
      // 🔴 PUT YOUR CLIENT ID HERE
      const CLIENT_ID = "9f61ae8ddd964f288f2454ad0bdfe9de";

      function init() {
        console.log("SDK ready, initializing...");
        const view = new window.AdobeDC.View({
          clientId: CLIENT_ID,
          divId: "adobe-dc-view",
        });

        // Try local sample first, then fall back to Adobe brochure
        const tryUrl = (url) =>
          view.previewFile(
            {
              content: { location: { url } },
              metaData: { fileName: url.split("/").pop() || "document.pdf" },
            },
            { embedMode: "SIZED_CONTAINER", defaultViewMode: "FIT_PAGE" }
          );

        const localUrl = window.location.origin + "/sample.pdf";
        tryUrl(localUrl).catch((e) => {
          console.error("Local failed, trying brochure:", e);
          tryUrl("https://documentcloud.adobe.com/view-sdk-demo/PDFs/Bodea%20Brochure.pdf");
        });
      }

      if (window.AdobeDC) {
        init();
      } else {
        document.addEventListener("adobe_dc_view_sdk.ready", init);
      }
    </script>
  </body>
</html>
