<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="doc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e0e7ff"/>
    </linearGradient>
  </defs>
  <!-- Rounded square background -->
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>
  <!-- Document page -->
  <rect x="120" y="80" width="220" height="280" rx="18" ry="18" fill="url(#doc)" opacity="0.95"/>
  <!-- Dog-ear fold -->
  <path d="M290 80 L340 130 L290 130 Z" fill="#c7d2fe"/>
  <!-- Text lines on document -->
  <rect x="152" y="150" width="150" height="12" rx="6" fill="#94a3b8" opacity="0.6"/>
  <rect x="152" y="178" width="120" height="12" rx="6" fill="#94a3b8" opacity="0.5"/>
  <rect x="152" y="206" width="140" height="12" rx="6" fill="#94a3b8" opacity="0.4"/>
  <rect x="152" y="234" width="100" height="12" rx="6" fill="#94a3b8" opacity="0.35"/>
  <rect x="152" y="262" width="130" height="12" rx="6" fill="#94a3b8" opacity="0.3"/>
  <!-- Magnifying lens circle -->
  <circle cx="320" cy="310" r="100" fill="none" stroke="url(#lens)" stroke-width="22" opacity="0.95"/>
  <!-- Lens glass highlight -->
  <circle cx="320" cy="310" r="78" fill="#3b82f6" opacity="0.15"/>
  <circle cx="295" cy="285" r="22" fill="white" opacity="0.18"/>
  <!-- Lens handle -->
  <line x1="392" y1="382" x2="440" y2="432" stroke="url(#lens)" stroke-width="26" stroke-linecap="round"/>
  <!-- Sparkle / insight dot -->
  <circle cx="320" cy="290" r="8" fill="#fbbf24" opacity="0.9"/>
  <circle cx="340" cy="320" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="300" cy="330" r="6" fill="#fbbf24" opacity="0.8"/>
</svg>
